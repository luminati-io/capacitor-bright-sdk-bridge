<!doctype html>
<html lang="en" dir="ltr" class="hydrated">
  <head>
    <meta charset="UTF-8" />
    <title>Example Capacitor App</title>
    <meta
      name="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="format-detection" content="telephone=no" />
  </head>
  <body>
    <div id="app">
      <h1>Bright SDK Capacitor Demo</h1>

      <div>
        <div>SDK version: <span id="sdk-version">—</span></div>
        <div>SDK uuid: <span id="sdk-uuid">—</span></div>
        <div>SDK choice: <span id="sdk-current-choice">—</span></div>
      </div>
      
      <div style="margin-top: 12px">
        <button id="show-consent-btn" type="button">Show consent</button>
        <button id="optout-btn" type="button">Opt out</button>
      </div>
    </div>

    <script src="./js/example.js" type="module"></script>
  </body>
</html>
